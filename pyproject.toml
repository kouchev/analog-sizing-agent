[project]
name = "analog-sizing-agent"
version = "0.1.0"
description = "An LLM agent that sizes a two-stage OTA with ngspice in the loop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=1.14"]

[project.optional-dependencies]
dev = ["pytest>=8"]
draw = ["schemdraw>=0.19"]

[project.scripts]
sizing-agent = "sizing_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sizing_agent"]
